plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

base.archivesName = "kaleidoscopetavern"

group = mod_group_id
version = mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def recipeViewer = providers.gradleProperty('recipeViewer').getOrElse('jei')
def withCompat = providers.gradleProperty('withCompat').getOrElse('true').toBoolean()
def includePortTests = providers.gradleProperty('clientSmoke').getOrElse('false').toBoolean() ||
        gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('gametest') }
if (!(recipeViewer in ['jei', 'rei', 'none'])) throw new GradleException('recipeViewer must be jei, rei or none')

sourceSets {
    gameTest {
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'kaleidoscope_tavern.client_smoke', providers.gradleProperty('clientSmoke').getOrElse('false')
            gameDirectory = project.file('run/client')
        }
        client2 {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments = [
                    "--username", "tartaric_acid"
            ]
            gameDirectory = project.file('run/client2')
        }
        server {
            server()
            //programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('run/server')
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'kaleidoscope_tavern.port_tests', 'true'
            gameDirectory = project.file('run/gametest')
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            jvmArguments = [
                    "-XX:+IgnoreUnrecognizedVMOptions",
                    "-XX:+AllowEnhancedClassRedefinition"
            ]
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (includePortTests) sourceSet(sourceSets.gameTest)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

repositories {
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:29.53.0.115"
    compileOnly "maven.modrinth:cloth-config:26.1.154+neoforge"
    compileOnly "maven.modrinth:architectury-api:20.1.17+neoforge"
    compileOnly "maven.modrinth:rei:26.1.819+neoforge"
    compileOnly "maven.modrinth:jade:26.1.12+neoforge"
    compileOnly "net.createmod.ponder:ponder-neoforge:1.0.52+mc26.1.2"
    compileOnly "maven.modrinth:curios:15.0.0+26.1.2"
    if (withCompat) {
        runtimeOnly "maven.modrinth:jade:26.1.12+neoforge"
        runtimeOnly "net.createmod.ponder:ponder-neoforge:1.0.52+mc26.1.2"
        runtimeOnly "maven.modrinth:curios:15.0.0+26.1.2"
    }
    if (recipeViewer == 'jei') {
        runtimeOnly "mezz.jei:jei-26.1.2-neoforge:29.53.0.115"
    } else if (recipeViewer == 'rei') {
        runtimeOnly "maven.modrinth:cloth-config:26.1.154+neoforge"
        runtimeOnly "maven.modrinth:architectury-api:20.1.17+neoforge"
        runtimeOnly "maven.modrinth:rei:26.1.819+neoforge"
    }
}

// EMI has no published NeoForge 26.1.2 API. Preserve the integration sources
// until a target API is available; never load a 1.21.1 mod into a 26.1.2 game.
sourceSets.main.java.exclude 'com/github/ysbbbbbb/kaleidoscopetavern/compat/emi/**'

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    // 编译源码文件，方便发布 maven
    withSourcesJar()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(Jar).configureEach {
    from(['LICENSE-CODE', 'LICENSE-ASSETS', 'NOTICE']) {
        into 'META-INF'
    }
}
